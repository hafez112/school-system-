services:
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
      - ./storage/logs:/var/www/storage/logs
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-school_system}
      DB_USERNAME: ${DB_USERNAME:-school}
      DB_PASSWORD: ${DB_PASSWORD:-school_secret}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-school-system-api}
      JWT_TTL: ${JWT_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      PHP_TZ: ${PHP_TZ:-Asia/Riyadh}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-school_system}
      MYSQL_USER: ${MYSQL_USER:-school}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-school_secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./packages/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
  api_vendor:
